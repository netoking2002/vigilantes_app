<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema de Fiscalização - CARRIS{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >

    <style>
        body {
            background: #f6f7fb;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .top-header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7f0;
            padding: 16px 0;
        }

        .top-header .brand-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo {
            height: 40px;
        }

        .brand-text-main {
            font-size: 20px;
            font-weight: 600;
            color: #004b93;
        }

        .brand-text-sub {
            font-size: 13px;
            color: #6b7280;
            margin-top: -4px;
        }

        .page-title-wrapper {
            text-align: center;
            margin-top: 24px;
            margin-bottom: 8px;
        }

        .page-title-main {
            font-size: 26px;
            font-weight: 600;
            color: #111827;
        }

        .page-title-sub {
            font-size: 14px;
            color: #6b7280;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px 40px;
        }

        .main-form-card {
            border-radius: 18px;
            border: 1px solid #e5e7f0;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
            background: linear-gradient(180deg, #ffffff 0%, #fdfdfd 100%);
            padding: 24px 24px 20px;
            position: relative;
            overflow: hidden;
        }

        .main-form-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 6px;
            height: 100%;
            background: #ffd047;
        }

        .main-form-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 18px;
            color: #111827;
        }

        .section-label {
            font-size: 13px;
            font-weight: 500;
            color: #4b5563;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            border-color: #e5e7eb;
            font-size: 14px;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 1px rgba(79, 70, 229, 0.15);
        }

        .btn-periodo {
            border-radius: 999px !important;
            font-size: 14px;
            padding: 8px 18px;
        }

        .btn-periodo:not(.active) {
            background: #f9fafb;
            color: #4b5563;
            border-color: #e5e7eb;
        }

        .btn-periodo.active {
            background: #4f46e5;
            border-color: #4f46e5;
        }

        .btn-guardar {
            background: #4f46e5;
            border-color: #4f46e5;
            color: #ffffff;
            border-radius: 999px;
            font-weight: 500;
            padding: 10px 26px;
            font-size: 14px;
        }

        .btn-guardar:hover {
            background: #4338ca;
            border-color: #4338ca;
        }

        /* Cartões da secção "Registo de Ocorrências" */
        .oc-box{
            display:flex;
            flex-direction:column;
            justify-content:center;
            padding:18px 10px;
            background:linear-gradient(180deg, #ffffff 0%, #fefefe 100%);
            border-radius:12px;
            border:1px solid #e4e6ef;
            text-decoration:none;
            color:#1f3b8e;
            box-shadow:0 4px 18px rgba(0,0,0,0.05);
            transition:0.22s;
        }

        .oc-box:hover{
            transform: translateY(-3px);
            box-shadow:0 6px 25px rgba(0,0,0,0.09);
        }

        .oc-title{
            font-size:15px;
            font-weight:600;
            color:#1a46a7;
        }

        .oc-sub{
            font-size:12px;
            color:#6c7283;
            margin-top:4px;
        }

        /* Botão Administrador */
        .btn-admin {
            border-radius: 999px;
            font-size: 14px;
            padding: 8px 16px;
            border: 1px solid #e5e7eb;
            background: #ffffff;
            color: #1f2937;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-admin:hover {
            background: #f9fafb;
            border-color: #d1d5db;
            color: #111827;
        }

        @media (max-width: 768px) {
            .page-title-main {
                font-size: 20px;
            }
            .main-form-card {
                padding: 18px 16px 16px;
            }
        }
    </style>
</head>

<body>

<header class="top-header">
  <div class="container d-flex justify-content-between align-items-center">
      <div class="brand-area">
          <img src="{{ url_for('static', filename='img/carris_logo.png') }}"
               alt="Carris" class="brand-logo">
          <div>
              <div class="brand-text-main">Vigilantes - Polícia Municipal</div>
              <div class="brand-text-sub">Direção de Controlo de Tráfego</div>
          </div>
      </div>

      <!-- ✅ Botão Administrador (canto superior direito) -->
      <a href="{{ url_for('admin') }}" class="btn-admin">
          Administrador
      </a>
  </div>
</header>

<div class="main-container">
    <div class="page-title-wrapper">
        <div class="page-title-main">Sistema de Fiscalização - CARRIS</div>
        <div class="page-title-sub">
            Registo de Ocorrências de Estacionamento Indevido
        </div>
    </div>

    {% block content %}{% endblock %}
</div>

</body>
</html>
