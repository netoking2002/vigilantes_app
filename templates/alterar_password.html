{% extends "base.html" %}
{% block title %}Definir nova palavra-passe{% endblock %}

{% block content %}

<div class="card main-form-card" style="max-width:620px;margin:0 auto;">
  <div class="card-body">
    <h5 class="mb-3">Definir nova palavra-passe</h5>

    <form method="post" class="row g-3">
      <div class="col-12 col-md-6">
        <label class="section-label mb-1">Nova palavra-passe</label>
        <input type="password" name="nova_password" class="form-control" minlength="8" required>
      </div>

      <div class="col-12 col-md-6">
        <label class="section-label mb-1">Repetir palavra-passe</label>
        <input type="password" name="repetir_password" class="form-control" minlength="8" required>
      </div>

      <div class="col-12 d-flex justify-content-end gap-2">
        <a href="{{ url_for('logout') }}" class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" class="btn btn-guardar">Guardar</button>
      </div>
    </form>

    <div class="mt-3">
      <small class="text-muted">
        A palavra-passe deve ter pelo menos 8 caracteres.
      </small>
    </div>
  </div>
</div>

{% endblock %}
