{% extends "base.html" %}

{% block title %}Editar Ocorrência{% endblock %}

{% block content %}

<div class="card mb-3">
  <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-2">
    <h5 class="mb-0">Editar Ocorrência #{{ ocorrencia.id }}</h5>
    <a href="{{ url_for('admin_ocorrencias') }}" class="btn btn-sm btn-secondary">Voltar</a>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <form method="post" class="row g-3">

      <div class="col-12 col-md-3">
        <label class="form-label">Data (dd/mm/aaaa)</label>
        <input name="data" class="form-control" value="{{ ocorrencia.data }}">
      </div>

      <div class="col-12 col-md-3">
        <label class="form-label">Hora (HH:MM)</label>
        <input name="hora" class="form-control" value="{{ ocorrencia.hora }}">
      </div>

      <div class="col-12 col-md-3">
        <label class="form-label">Período</label>
        <input name="periodo" class="form-control" value="{{ ocorrencia.periodo }}">
      </div>

      <div class="col-12 col-md-3">
        <label class="form-label">Viatura</label>
        <input name="viatura" class="form-control" value="{{ ocorrencia.viatura }}">
      </div>

      <div class="col-12 col-md-3">
        <label class="form-label">Nº Ordem CCT</label>
        <input name="numero_ordem_cct" class="form-control" value="{{ ocorrencia.numero_ordem_cct }}">
      </div>

      <div class="col-12 col-md-3">
        <label class="form-label">Nº Ordem PM</label>
        <input name="numero_ordem_pm" class="form-control" value="{{ ocorrencia.numero_ordem_pm }}">
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">Tipo ocorrência</label>
        <input name="tipo" class="form-control" value="{{ ocorrencia.tipo }}">
      </div>

      <div class="col-12 col-md-4">
        <label class="form-label">Matrícula</label>
        <input name="matricula" class="form-control" value="{{ ocorrencia.matricula }}">
      </div>

      <div class="col-12 col-md-8">
        <label class="form-label">Morada completa</label>
        <input name="morada" class="form-control" value="{{ ocorrencia.morada }}">
      </div>

      <div class="col-12 col-md-3">
        <label class="form-label">Latitude</label>
        <input name="latitude" class="form-control" value="{{ ocorrencia.latitude }}">
      </div>

      <div class="col-12 col-md-3">
        <label class="form-label">Longitude</label>
        <input name="longitude" class="form-control" value="{{ ocorrencia.longitude }}">
      </div>

      <div class="col-12">
        <label class="form-label">Descrição</label>
        <textarea name="descricao" class="form-control" rows="4">{{ ocorrencia.descricao }}</textarea>
      </div>

      <div class="col-12 d-flex justify-content-end gap-2">
        <a href="{{ url_for('admin_ocorrencias') }}" class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Guardar alterações</button>
      </div>

    </form>
  </div>
</div>

{% endblock %}
