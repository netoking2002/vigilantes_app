{% extends "base.html" %}

{% block title %}Nova Ocorrência – {{ tipo }}{% endblock %}

{% block content %}

<div class="main-form-card mb-4">
    <div class="row mb-3">
        <div class="col-12">
            <div class="main-form-title">
                Nova Ocorrência – {{ tipo }}
            </div>
        </div>
    </div>

    <form method="post" class="row g-3" onsubmit="return validarOcorrencia();">
        <input type="hidden" name="tipo" value="{{ tipo }}">

        <div class="col-12 col-md-6">
            <label class="section-label mb-1">Matrícula</label>
            <input type="text"
                   id="matricula"
                   name="matricula"
                   class="form-control"
                   placeholder="XX-XX-XX"
                   required>
        </div>

        <div class="col-12 col-md-6 d-flex align-items-end">
            <div class="form-check ms-md-2">
                <input class="form-check-input" type="checkbox" id="chkEstrangeira">
                <label class="form-check-label" for="chkEstrangeira">
                    Matrícula estrangeira
                </label>
            </div>
        </div>

        <div class="col-12 col-md-6">
            <label class="section-label mb-1">Data da ocorrência</label>
            <input type="text"
                   name="data_ocorr"
                   class="form-control"
                   value="{{ data_ocorr }}"
                   readonly>
        </div>

        <div class="col-12 col-md-6">
            <label class="section-label mb-1">Hora da ocorrência</label>
            <input type="text"
                   name="hora_ocorr"
                   class="form-control"
                   value="{{ hora_ocorr }}"
                   readonly>
        </div>

        <div class="col-12 col-md-8">
            <label class="section-label mb-1">Morada completa</label>
            <input type="text"
                   name="morada"
                   id="moradaCompleta"
                   class="form-control"
                   placeholder="Morada completa (pode ser preenchida automaticamente ou à mão)"
                   required>
        </div>

        <div class="col-12 col-md-4">
            <label class="section-label mb-1">Localização (GPS)</label>
            <button type="button"
                    id="btnLocalizacao"
                    class="btn btn-outline-primary w-100"
                    onclick="obterLocalizacao()">
                Obter localização
            </button>
            <small id="gpsStatus" class="text-muted d-block mt-1">
                Latitude / Longitude ainda não obtidas.
            </small>
        </div>

        <div class="col-12">
            <label class="section-label mb-1">Descrição</label>
            <textarea name="descricao" class="form-control" rows="4" placeholder="Descrição (opcional)"></textarea>
        </div>

        <input type="hidden" name="latitude"  id="latitude">
        <input type="hidden" name="longitude" id="longitude">

        <div class="col-12 d-flex justify-content-between mt-3">
            <a href="{{ url_for('index') }}" class="btn btn-secondary">
                Cancelar
            </a>
            <button type="submit" class="btn btn-success">
                Guardar ocorrência
            </button>
        </div>

    </form>
</div>

<script>
    const inputMatricula = document.getElementById('matricula');
    const chkEstrangeira = document.getElementById('chkEstrangeira');

    function aplicarMascaraMatricula() {
        if (chkEstrangeira.checked) {
            inputMatricula.removeAttribute("pattern");
            inputMatricula.maxLength = 30;
            inputMatricula.placeholder = 'Matrícula estrangeira';
        } else {
            inputMatricula.setAttribute(
                "pattern",
                "[A-Za-z0-9]{2}-[A-Za-z0-9]{2}-[A-Za-z0-9]{2}"
            );
            inputMatricula.maxLength = 8;
            inputMatricula.placeholder = 'XX-XX-XX';
        }
    }

    inputMatricula.addEventListener('input', function () {
        if (chkEstrangeira.checked) return;

        let v = inputMatricula.value.toUpperCase();
        v = v.replace(/[^A-Z0-9]/g, '');
        if (v.length > 6) v = v.slice(0, 6);

        const partes = [];
        for (let i = 0; i < v.length; i += 2) {
            partes.push(v.slice(i, i + 2));
        }
        inputMatricula.value = partes.join('-');
    });

    chkEstrangeira.addEventListener('change', aplicarMascaraMatricula);
    window.addEventListener('load', aplicarMascaraMatricula);

    function obterLocalizacao() {
        const btn = document.getElementById('btnLocalizacao');
        const status = document.getElementById('gpsStatus');
        const latInput = document.getElementById('latitude');
        const lonInput = document.getElementById('longitude');
        const morada = document.getElementById('moradaCompleta');

        if (!navigator.geolocation) {
            status.textContent = 'Geolocalização não suportada neste dispositivo.';
            return;
        }

        btn.disabled = true;
        status.textContent = 'A obter localização.';

        navigator.geolocation.getCurrentPosition(
            async (pos) => {
                const lat = pos.coords.latitude.toFixed(6);
                const lon = pos.coords.longitude.toFixed(6);

                latInput.value = lat;
                lonInput.value = lon;
                status.textContent = `Latitude: ${lat} | Longitude: ${lon}`;

                try {
                    const resp = await fetch(
                        'https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' +
                        encodeURIComponent(lat) +
                        '&lon=' + encodeURIComponent(lon)
                    );

                    if (resp.ok) {
                        const dados = await resp.json();

                        let moradaCurta = "";
                        if (dados.address) {
                            const addr = dados.address;
                            let rua = addr.road
                                       || addr.pedestrian
                                       || addr.residential
                                       || addr.footway
                                       || addr.path
                                       || addr.cycleway
                                       || addr.street
                                       || addr.neighbourhood
                                       || addr.suburb
                                       || addr.village
                                       || addr.town
                                       || addr.city
                                       || addr.name;

                            const numero = addr.house_number || "";

                            if (rua) {
                                moradaCurta = numero ? `${rua} ${numero}` : rua;
                            }
                        }
                        if (!moradaCurta && dados.display_name) {
                            moradaCurta = dados.display_name;
                        }

                        if (moradaCurta && !morada.value) {
                            morada.value = moradaCurta;
                        }
                    }
                } catch (e) {
                    console.error(e);
                } finally {
                    btn.disabled = false;
                }
            },
            (erro) => {
                console.error(erro);
                status.textContent = 'Não foi possível obter a localização.';
                btn.disabled = false;
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    }

    function validarOcorrencia() {
        const matricula = inputMatricula.value.trim();
        const morada = document.getElementById('moradaCompleta').value.trim();

        if (!matricula || !morada) {
            alert("Preenche a Matrícula e a Morada completa antes de guardar a ocorrência.");
            return false;
        }
        return true;
    }
</script>

{% endblock %}
